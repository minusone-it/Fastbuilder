# Block Selector GUI
block-selector:
  name: "Block Selector"
  max-slots: 45

# Mode Changer GUI
mode-changer:
  name: "Mode Changer"
  max-slots: 45

# Settings GUI
settings:
  name: "Settings"
  max-slots: 27

# Confirm Reset Stats gui's name
confirm-stats-reset: "Confirm"

# Island Selector gui's name
island-selector: "Island Selector"

# Replays gui's name
# Placeholder:
# %page% - The current page of replays
replays: "Replays - Page %page%"

# %block_status% message
block-status:
  purchased:
    "&aYou already own this block!"
  not-purchased:
    "&cYou don't own this block yet!"


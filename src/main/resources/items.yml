# Leave Fastbuilder item's name
leave-item: "&cLeave &7(Right-Click to use)"

leave-item-material: EYE_OF_ENDER:0

# Replay item's name
replay-item: "&5Replay View &7(Right-Click to use)"

replay-item-material: BOOK:0

# Island Selector item's name
islandselector-item: "&6Island Selector &7(Right-Click to use)"

islandselector-item-material: NETHER_STAR:0

# Settings item's name
settings-item: "&2Settings &7(Right-Click to use)"

settings-item-material: EMERALD:0

replays:
  cancel:
    material: BARRIER:0
    name: "&cCancel &7(Right-Click to use)"
  next_tick:
    material: BLAZE_ROD:0
    name: "&a+1 Tick &7(Right-Click to use)"
  prev_tick:
    material: STICK:0
    name: "&a-1 Tick &7(Right-Click to use)"
  stopped_replay:
    material: INK_SACK:1
    name: "&cStopped &7(Right-Click to use)"
  started_replay:
    material: INK_SACK:10
    name: "&aRunning &7(Right-Click to use)"
  restart_replay:
    material: INK_SACK:14
    name: "&6Restart &7(Right-Click to use)"
# Ender Eye Item to go to lobby (only supports bungee)
leave-item-toggled: false
backend-server: lobby

# Change Page item
change-page:
  next-page:
    material: ARROW:0
    name: "&aNext Page"
    lore:
      - ""
  previous-page:
    material: ARROW:0
    name: "&cPrevious Page"
    lore:
      - ""

# Reset Item (like the bed on Bridger Land)
reset_item:
  enabled: true
  name: "&cRespawn &7(Right-Click to use)"
  material: BED:0
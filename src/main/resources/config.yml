# The plugin prefix, called in the commands. Leave a space after the last char.
prefix: "§3§lFastbuilder §7» "

# You can make it 0 to disable it.
reset-stats-cost: 50

# Jump Plate like the Bridger Land one.
jump-plate: false

# Luckperms support with the scoreboard.
luckperms-support: false

# The distance from the spawn that teleports back the player to the spawn
max-distance: 4

# Mode Changer NPC's name
npc-name: "Mode Changer"

# Leave Fastbuilder item's name
leave-item: "§cLeave §7(Right-Click to use)"

# Replay item's name
replay-item: "§5Replay View §7(Right-Click to use)"

# Island Selector item's name
islandselector-item: "§6Island Selector §7(Right-Click to use)"

# Settings item's name
settings-item: "§2Settings §7(Right-Click to use)"

# Ender Eye Item to go to lobby (only supports bungee)
ender-eye: false

# Placeholders:
# %time% - Time of the course;
# %pb% - Personal Best;
# %difference% - Difference between the time and the pb.
messages:
  time:
    - "&8----------------------------------"
    - "&7You've finished the course!"
    - ""
    - "&aTime: &e&l%time%"
    - "&aPB: &e&l%pb% &8| &e&l%difference%"
    - "&8----------------------------------"
  personal-best:
    - "&8----------------------------------"
    - "&b&lNEW PERSONAL BEST!"
    - ""
    - "&7You've finished the course!"
    - ""
    - "&aTime: &e&l%time%"
    - "&aPB: &e&l%pb% &8| &b&l%difference%"
    - "&8----------------------------------"

# Holo Lines
# Placeholders:
# %player% - Player's name;
# %pb% - Player's personal best;
# %successful_attempts% - Player's successful attempts;
# %total_attempts% - Player's total attempts.
holo:
  - "&b%player%'s stats:"
  - "Personal Best: %pb%"
  - "Successful Attempts: %successful_attempts%"
  - "Total Attempts: %total_attempts%"

# Score Title.
# Placeholders:
# %time% - Current time;
# %coins% - The coins gained of the player.
title: "&aTime: &e%time%"
subtitle: "+&e%coins% coins!"

# Scoreboard Lines.
# Placeholders:
# %time% - Current time;
# %pb% - Personal Best;
# %top_1 - Session top 1;
# %top_2 - Session top 2;
# %top_3 - Session top 3;
# %coins% - The current coins of the player.
scoreboard:
  title: "&b&lFastBuilder"
  lines:
    15: "&a&8&l|"
    14: "&a&8&l| &b&lPersonal Best:"
    13: "&a&8&l| &e%pb%"
    12: "&a&8&l|"
    11: "&a&8&l| &e&lSession-Top:"
    10: "&a&8&l| &7%top_1%"
    9:  "&a&8&l| &7%top_2%"
    8:  "&a&8&l| &7%top_3%"
    7:  "&a&8&l|"
    6:  "&a&8&l| &e&lCoins:"
    5:  "&a&8&l| &e%coins%"
    4:  "&a&8&l|"
    3:  "&a&8&l| &a&lTime:"
    2:  "&a&8&l| &e%time%"
    1:  "&a&8&l|   &7&oexample.net"

# Go get it via on https://discord.gg/CnQGtfEdjj
license: none

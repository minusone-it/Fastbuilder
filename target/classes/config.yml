# For color formatting, you have to use §, & will not work. & will work only on finish messages.

# The plugin prefix, called in the commands. Leave a space after the last char.
prefix: "§3§lFastbuilder§7>> "
# The scoreboard prefix, called only in the scoreboard.
scoreboard-prefix: "§3§lFastbuilder"
# Shown on scoreboard.
server-ip: example.net
# You can make it 0 to disable it.
reset-stats-cost: 100
# Jump Plate like the Bridger Land one.
jump-plate: false
# Placeholders:
# %time% - Time of the course;
# %pb% - Personal Best;
# %difference% - Difference between the time and the pb.
messages:
  time:
    - "&8----------------------------------"
    - "&7You've finished the course!"
    - ""
    - "&aTime: &e&l%time%"
    - "&aPB: &e&l%pb% &8| &e&l%difference%"
    - "&8----------------------------------"
  personal-best:
    - "&8----------------------------------"
    - "&b&lNEW PERSONAL BEST!"
    - ""
    - "&7You've finished the course!"
    - ""
    - "&aTime: &e&l%time%"
    - "&aPB: &e&l%pb% &8| &b&l%difference%"
    - "&8----------------------------------"

license: none

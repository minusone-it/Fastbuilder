name: Fastbuilder
version: '1.4.5'
main: it.minusone.fastbuilder.Main
api-version: '1.8.8'
authors: [ _MinusOne_ ]
description: Made with <3 by _MinusOne_.
website: https://builtbybit.com/resources/fastbuilder.62493/.
depend:
  - ProtocolLib
softdepend:
  - LuckPerms
commands:
  fastbuilder:
    description:
      Main command for the plugin.
    aliases:
      - fb
  stats:
    description:
      Command to see stats of another player
    aliases:
      - statistics
permissions:
  fastbuilder.admin:
    default: op
